<body class="bg-amber-50/40 text-stone-800 antialiased min-h-screen">

  <script type="text/babel">
    const { useState, useMemo } = React;

    function calculateAge(dobString) {
      if (!dobString) return 0;
      const today = new Date();
      const birthDate = new Date(dobString);
      let age = today.getFullYear() - birthDate.getFullYear();
      const m = today.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }
      return age;
    }

    const BANK_DETAILS = {
      bankName: "Sampath Bank PLC",
      branch: "Kaduwela Branch",
      accountName: "S. P. Wijesinghe",
      accountNumber: "116254863677",
      swiftCode: "BSAMLKLX",
      whatsappNumber: "0775569178",
      whatsappFormatted: "+94 77 556 9178",
      whatsappRaw: "94775569178",
      supportEmail: "support.goldenconnect@gmail.com",

    };

    const INITIAL_PROFILES = [

        bio: "I spent 35 years designing public parks. Now in retirement, I love tending my greenhouse, visiting local farmers markets, and exploring Sri Lankan nature trails.",
        interests: ["Gardening", "Travel", "Cooking", "Photography"],
        purpose: "Travel Buddy",

        interests: ["Reading", "Music", "Cooking", "History"],

        image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=800",

      {

        age: 58,

        occupation: "Art Gallery Curator",
        tagline: "Art lover, beach walker, and coffee connoisseur.",
        bio: "Passionate about classical art, music concerts, and weekend beach walks in Galle Fort. Life is better when shared with a kind, intelligent soul.",
        interests: ["Music", "Art", "Hiking", "Travel"],
        purpose: "Romance",
        createdBy: "Self",
        image: "https://images.unsplash.com/photo-1567532939604-b6b5b0db2604?auto=format&fit=crop&q=80&w=800",
        phone: "+94 76 555 1212",
        email: "margaret.m@example.com",
        isVerified: true,
        isPopular: true
      },
      {
        id: 4,
        name: "Dr. Robert Chen",
        dob: "1953-08-30",
        age: 71,
        gender: "Male",
        location: "Negombo, Sri Lanka",
        occupation: "Retired Physician",
        tagline: "Always curious. Passionate about acoustic guitar & stargazing.",
        bio: "Retired from medicine, now spending time learning blues guitar and stargazing. I value active listening, sincerity, and quiet seaside dinners.",
        interests: ["Guitar", "Gardening", "Reading", "Astronomy"],
        purpose: "Companionship",
        createdBy: "Daughter",
        image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=800",
        phone: "+94 70 888 9900",
        email: "dr.robert@example.com",
        isVerified: true,
        isPopular: false
      }
    ];

    function App() {
      const [fontSize, setFontSize] = useState('normal'); 
      const [highContrast, setHighContrast] = useState(false);
      const [profiles, setProfiles] = useState(INITIAL_PROFILES);
      const [searchQuery, setSearchQuery] = useState("");
      const [genderFilter, setGenderFilter] = useState("all");
      const [selectedAgeRange, setSelectedAgeRange] = useState("all");
      const [purposeFilter, setPurposeFilter] = useState("all");
      const [hasPaid, setHasPaid] = useState(false);
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [showRegisterModal, setShowRegisterModal] = useState(false);

      const [formData, setFormData] = useState({
        name: '',
        dob: '1970-01-01',
        gender: 'Female',
        location: 'Colombo, Sri Lanka',
        occupation: '',
        tagline: '',
        bio: '',
        interests: 'Gardening, Reading',
        purpose: 'Companionship',
        createdBy: 'Self',
        image: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=800',
        phone: '',
        email: ''
      });

      const calculatedAge = useMemo(() => calculateAge(formData.dob), [formData.dob]);

      const getFontSizeClass = () => {
        if (fontSize === 'large') return 'text-lg';
        if (fontSize === 'xlarge') return 'text-xl';
        return 'text-base';
      };

      const filteredProfiles = useMemo(() => {
        return profiles.filter(p => {
          if (genderFilter !== 'all' && p.gender.toLowerCase() !== genderFilter.toLowerCase()) return false;
          if (selectedAgeRange === '50-60' && (p.age < 50 || p.age > 60)) return false;
          if (selectedAgeRange === '60-70' && (p.age < 60 || p.age > 70)) return false;
          if (selectedAgeRange === '70+' && p.age < 70) return false;
          if (purposeFilter !== 'all' && p.purpose.toLowerCase() !== purposeFilter.toLowerCase()) return false;
          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            return p.name.toLowerCase().includes(q) || 
                   p.location.toLowerCase().includes(q) || 
                   p.occupation.toLowerCase().includes(q);
          }
          return true;
        });
      }, [profiles, genderFilter, selectedAgeRange, purposeFilter, searchQuery]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setFormData({...formData, image: reader.result});
          };
          reader.readAsDataURL(file);
        }
      };

      const openWhatsAppVerification = () => {
        const message = `Hello GoldenConnect Admin,\n\nI have completed the bank transfer of 3,000 LKR for 3 Months Full Access.\n\nBank: ${BANK_DETAILS.bankName} (${BANK_DETAILS.branch})\nAccount Name: ${BANK_DETAILS.accountName}\nAccount No: ${BANK_DETAILS.accountNumber}\n\nAttached is my payment slip photo. Please activate my account access.`;
        window.open(`https://wa.me/${BANK_DETAILS.whatsappRaw}?text=${encodeURIComponent(message)}`, '_blank');
      };

      const openDirectWhatsAppChat = (phone, name) => {
        const cleanPhone = phone.replace(/[^0-9]/g, '');
        const message = encodeURIComponent(`Hello ${name}, I saw your profile on GoldenConnect and would love to connect with you.`);
        window.open(`https://wa.me/${cleanPhone}?text=${message}`, '_blank');
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const exactAge = calculateAge(formData.dob);
        if (exactAge < 50) {
          alert(`Age Verification Gate: You are ${exactAge} years old. GoldenConnect is exclusively for seniors aged 50 and above.`);
          return;
        }

        const newProfile = {
          id: Date.now(),
          name: formData.name,
          dob: formData.dob,
          age: exactAge,
          gender: formData.gender,
          location: formData.location,
          occupation: formData.occupation,
          tagline: formData.tagline,
          bio: formData.bio,
          interests: formData.interests.split(',').map(i => i.trim()),
          purpose: formData.purpose,
          createdBy: formData.createdBy,
          image: formData.image || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=800",
          phone: formData.phone,
          email: formData.email,
          isVerified: true,
          isPopular: false
        };

        setProfiles([newProfile, ...profiles]);
        setShowRegisterModal(false);
        alert(`Congratulations ${formData.name}! Your age (${exactAge}) has been verified and your profile is now live.`);
      };

      return (
        <div className={`min-h-screen flex flex-col justify-between ${highContrast ? 'bg-black text-yellow-300 font-sans' : 'bg-amber-50/40 text-stone-800 font-sans'}`}>
          <div>
            {/* SENIOR ACCESSIBILITY BAR */}
            <div className={`${highContrast ? 'bg-yellow-400 text-black' : 'bg-amber-900 text-amber-50'} px-3 py-2 text-xs font-semibold shadow-inner`}>
              <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2 text-center sm:text-left">
                <span className="flex items-center justify-center gap-1.5">
                  <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Verified Senior Community (50+)
                </span>
                <div className="flex flex-wrap items-center justify-center gap-2 sm:gap-4">
                  <div className="flex items-center gap-1 bg-black/20 rounded-lg px-2 py-1">
                    <span className="text-[11px]">Text:</span>
                    <button onClick={() => setFontSize('normal')} className={`px-1.5 py-0.5 rounded font-bold ${fontSize === 'normal' ? 'bg-white/30' : ''}`}>A</button>
                    <button onClick={() => setFontSize('large')} className={`px-1.5 py-0.5 rounded font-bold ${fontSize === 'large' ? 'bg-white/30' : ''}`}>A+</button>
                    <button onClick={() => setFontSize('xlarge')} className={`px-1.5 py-0.5 rounded font-extrabold ${fontSize === 'xlarge' ? 'bg-white/30' : ''}`}>A++</button>
                  </div>
                  <button onClick={() => setHighContrast(!highContrast)} className="bg-black/20 hover:bg-black/30 px-2.5 py-1 rounded-lg border border-white/20 transition font-bold text-[11px]">

              </div>
            </div>

                  <div className="flex items-center gap-3">
                    <div className={`p-2.5 rounded-2xl font-black text-xl shadow-md ${highContrast ? 'bg-yellow-400 text-black' : 'bg-amber-800 text-white'}`}>
                      GC
                    </div>
                    <div>

                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                  <button onClick={() => setShowRegisterModal(true)} className="bg-stone-100 hover:bg-stone-200 text-stone-800 border border-stone-300 text-xs font-bold px-3 py-2 rounded-xl transition shadow-sm">
                    + Add Profile
                  </button>

                  {hasPaid ? (
                    <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-2 rounded-xl border border-emerald-300">
                      ✓ Active
                    </span>
                  ) : (
                    <button onClick={() => setShowPaymentModal(true)} className="bg-amber-800 hover:bg-amber-900 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition flex items-center gap-1">
                      <span>Unlock</span>
                      <span className="bg-amber-700 text-amber-100 text-[10px] px-1 py-0.5 rounded">3k LKR</span>
                    </button>
                  )}
                </div>
              </div>
            </header>

            {/* MAIN CONTAINER */}
            <main className={`max-w-6xl mx-auto px-4 py-6 ${getFontSizeClass()}`}>
              
              {/* HERO BANNER */}
              <div className={`p-6 sm:p-8 rounded-3xl mb-8 ${highContrast ? 'bg-yellow-400 text-black' : 'bg-gradient-to-r from-amber-800 via-amber-900 to-stone-900 text-white'} shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border border-amber-900/20`}>
                <div className="space-y-2">
                  <div className="inline-block bg-amber-700/50 text-amber-100 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30">
                    Sri Lanka's #1 Dedicated Senior Matchmaker
                  </div>
                  <h2 className="text-2xl sm:text-4xl font-extrabold tracking-tight">Find Genuine Companionship</h2>
                  <p className="text-amber-100 text-xs sm:text-base max-w-2xl leading-relaxed">
                    Browse verified senior profiles freely. Deposit 3,000 LKR directly to Sampath Bank to unlock unlimited direct phone and WhatsApp contact details for 3 full months.
                  </p>
                </div>
                <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                  <button onClick={() => setShowRegisterModal(true)} className="bg-white text-amber-900 hover:bg-amber-50 font-extrabold text-xs sm:text-sm px-5 py-3 rounded-xl shadow transition text-center">
                    + Create My Profile
                  </button>
                  {!hasPaid && (
                    <button onClick={() => setShowPaymentModal(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm px-5 py-3 rounded-xl shadow transition text-center">

                  <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=400" alt="Sugath Wijesinghe - Founder" className="w-full h-full object-cover" />
                </div>
                <div className="space-y-2 text-center md:text-left">
                  <span className="bg-amber-100 text-amber-900 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                    Founder & CEO Message
                  </span>
                  <h3 className="text-2xl font-black">Sugath Wijesinghe</h3>
                  <p className="text-xs font-bold text-amber-800 uppercase">Founder & Director, GoldenConnect Sri Lanka</p>
                  <p className="text-sm leading-relaxed opacity-90">
                    "GoldenConnect was built with a sincere mission: to provide a safe, respectful, and verified community where seniors across Sri Lanka can find genuine companionship, share experiences, and enjoy their golden years with peace of mind."
                  </p>
                </div>
              </div>

              {/* SEARCH & FILTER TOOLBAR */}
              <div className={`p-5 rounded-2xl mb-8 space-y-4 ${highContrast ? 'bg-black border border-yellow-400' : 'bg-white border border-stone-200 shadow-sm'}`}>
                <div className="flex justify-between items-center">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-amber-900 flex items-center gap-1.5">
                    <span>🔍</span> Search Senior Profiles
                  </h3>
                  <span className="text-xs font-bold text-stone-500">
                    Showing {filteredProfiles.length} of {profiles.length}
                  </span>
                </div>
                
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                  <div>
                    <label className="block text-[11px] font-bold text-stone-500 mb-1">Keywords</label>
                    <input 
                      type="text" 
                      placeholder="City, name, occupation..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className={`w-full px-3 py-2 rounded-xl border text-sm focus:outline-none ${highContrast ? 'bg-black text-yellow-300 border-yellow-400' : 'bg-stone-50 border-stone-200'}`}
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-stone-500 mb-1">Gender</label>
                    <select 
                      value={genderFilter}
                      onChange={(e) => setGenderFilter(e.target.value)}
                      className={`w-full px-3 py-2 rounded-xl border text-sm font-semibold ${highContrast ? 'bg-black text-yellow-300 border-yellow-400' : 'bg-stone-50 border-stone-200'}`}
                    >
                      <option value="all">All Genders</option>
                      <option value="female">Women Only</option>
                      <option value="male">Men Only</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-stone-500 mb-1">Age Bracket</label>
                    <select 
                      value={selectedAgeRange}
                      onChange={(e) => setSelectedAgeRange(e.target.value)}
                      className={`w-full px-3 py-2 rounded-xl border text-sm font-semibold ${highContrast ? 'bg-black text-yellow-300 border-yellow-400' : 'bg-stone-50 border-stone-200'}`}
                    >
                      <option value="all">All Ages (50+)</option>
                      <option value="50-60">50 – 60 Years</option>
                      <option value="60-70">60 – 70 Years</option>
                      <option value="70+">70+ Years</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-stone-500 mb-1">Relationship Goal</label>
                    <select 
                      value={purposeFilter}
                      onChange={(e) => setPurposeFilter(e.target.value)}
                      className={`w-full px-3 py-2 rounded-xl border text-sm font-semibold ${highContrast ? 'bg-black text-yellow-300 border-yellow-400' : 'bg-stone-50 border-stone-200'}`}
                    >
                      <option value="all">Any Goal</option>
                      <option value="companionship">Companionship</option>
                      <option value="travel buddy">Travel Buddy</option>
                      <option value="romance">Romance</option>
                      <option value="marriage">Marriage</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* PROFILES GRID */}
              {filteredProfiles.length === 0 ? (
                <div className="bg-white p-12 rounded-3xl text-center border border-dashed border-stone-300 space-y-3">
                  <p className="text-4xl">🔎</p>
                  <h3 className="text-lg font-bold text-stone-800">No matching profiles found</h3>
                  <button onClick={() => { setSearchQuery(''); setGenderFilter('all'); setSelectedAgeRange('all'); setPurposeFilter('all'); }} className="mt-2 text-xs font-bold text-amber-900 underline">
                    Reset All Filters
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  {filteredProfiles.map(profile => (
                    <div key={profile.id} className={`rounded-3xl overflow-hidden shadow-md border flex flex-col justify-between transition hover:shadow-lg ${highContrast ? 'bg-black border-yellow-400' : 'bg-white border-stone-200'}`}>
                      <div>
                        <div className="relative h-72 sm:h-80 w-full bg-stone-200">
                          <img src={profile.image} alt={profile.name} className="w-full h-full object-cover" />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent" />
                          
                          <div className="absolute bottom-4 left-5 right-5 text-white flex justify-between items-end">
                            <div>
                              <div className="flex items-center gap-2">
                                <h3 className="text-xl sm:text-2xl font-black">{profile.name}, {profile.age}</h3>
                                {profile.isVerified && (
                                  <span className="bg-emerald-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow">
                                    ✓ Verified
                                  </span>
                                )}
                              </div>
                              <p className="text-xs text-amber-200 font-semibold mt-0.5">
                                📍 {profile.location} • {profile.gender}
                              </p>
                            </div>
                            
                            <span className="bg-amber-800/90 text-amber-100 text-xs font-bold px-2.5 py-1 rounded-xl shadow">
                              {profile.purpose}
                            </span>
                          </div>

                          <div className="absolute top-4 left-4 flex gap-2">
                            {profile.isPopular && (
                              <span className="bg-amber-500 text-white text-[10px] font-extrabold px-2.5 py-1 rounded
